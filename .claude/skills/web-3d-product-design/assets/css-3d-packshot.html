<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSS 3D Packshot — starter</title>
<style>
  :root{
    --bg-0:#0b0c10; --bg-1:#15161c; --ink-0:#f5f6f8; --ink-1:#a7abb8;
    --accent:#ff5a3c; --accent-ink:#1a0e0a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family: -apple-system, "Inter", system-ui, sans-serif;
    background: radial-gradient(120% 100% at 50% -10%, var(--bg-1), var(--bg-0));
    color:var(--ink-0); min-height:100vh; display:grid; place-items:center; padding:48px 24px;
  }

  /* ---------- Hero layout (Part 1 spacing/type rules applied) ---------- */
  .hero{
    display:grid; grid-template-columns: 1fr 1fr; gap:64px; align-items:center;
    max-width:1200px; width:100%;
  }
  @media (max-width: 860px){ .hero{ grid-template-columns:1fr; text-align:center; } }
  .eyebrow{ color:var(--accent); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:14px; margin:0 0 16px; }
  h1{ font-size:48px; line-height:1.05; letter-spacing:-0.02em; margin:0 0 24px; font-weight:700; }
  p.lede{ color:var(--ink-1); font-size:18px; line-height:1.6; margin:0 0 32px; max-width:44ch; }
  .cta{ display:inline-flex; gap:12px; }
  .btn{
    padding:14px 28px; border-radius:12px; font-weight:600; font-size:15px; text-decoration:none;
    transition: transform 200ms cubic-bezier(.16,1,.3,1), box-shadow 200ms;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(255,90,60,.5); }
  .btn-ghost{ color:var(--ink-0); border:1px solid rgba(255,255,255,.18); }

  /* ---------- 3D stage ---------- */
  .stage{
    perspective: 1400px; perspective-origin: 50% 40%;
    aspect-ratio: 1 / 1; position:relative; display:grid; place-items:center;
  }
  .product{
    position:relative; width:220px; height:320px;
    transform-style:preserve-3d;
    transform: rotateX(8deg) rotateY(-18deg);
    transition: transform 300ms cubic-bezier(.16,1,.3,1);
  }

  /* jar body — swap this whole block for a real product <img> when you have one:
     <img class="product-img" src="product.png" /> positioned the same way,
     keeping the ::after lighting overlay and shadow/reflection elements below. */
  .jar-body{
    position:absolute; inset:0; border-radius: 28px;
    background: linear-gradient(100deg, #2b2d36 0%, #1c1d24 45%, #26272f 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    overflow:hidden;
  }
  .jar-label{
    position:absolute; left:8%; right:8%; top:30%; bottom:22%;
    background: linear-gradient(160deg, var(--accent), #ff8a3c);
    border-radius:10px; display:grid; place-items:center; text-align:center; padding:12px;
  }
  .jar-label b{ font-size:22px; letter-spacing:-.01em; color:var(--accent-ink); }
  .jar-label span{ font-size:11px; color:var(--accent-ink); opacity:.8; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
  .jar-lid{
    position:absolute; left:2%; right:2%; top:-4%; height:14%;
    background: linear-gradient(100deg, #3a3c46, #24252c 60%, #2f303a);
    border-radius:10px;
  }

  /* lighting overlay — this is what sells the "photograph" illusion, see references/css-3d-product-shots.md step 2 */
  .product::after{
    content:""; position:absolute; inset:0; border-radius:28px; pointer-events:none;
    background: linear-gradient(115deg,
      rgba(255,255,255,.35) 0%, rgba(255,255,255,.08) 25%,
      rgba(0,0,0,0) 50%, rgba(0,0,0,.18) 80%, rgba(0,0,0,.32) 100%);
    mix-blend-mode: overlay;
  }

  .contact-shadow{
    position:absolute; bottom:-8%; left:50%; width:78%; height:18%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 45%, rgba(0,0,0,0) 75%);
    transform: translateX(-50%) rotateX(85deg); filter: blur(4px); z-index:-1;
  }
  .reflection{
    position:absolute; top:100%; left:0; right:0; height:100%;
    transform: scaleY(-1) scaleY(.5); transform-origin:top; opacity:.18;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.5), transparent 70%);
    filter: blur(1px);
  }
</style>
</head>
<body>
  <section class="hero">
    <div>
      <p class="eyebrow">New — Formula 2.0</p>
      <h1>Built for the<br/>work you put in.</h1>
      <p class="lede">Clinically-dosed, third-party tested, zero filler. The version of this category that actually reads its own label.</p>
      <div class="cta">
        <a href="#" class="btn btn-primary">Shop now</a>
        <a href="#" class="btn btn-ghost">See ingredients</a>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="product" id="product">
        <div class="jar-body">
          <div class="jar-label"><b>PEAK</b><span>Performance</span></div>
        </div>
        <div class="jar-lid"></div>
        <div class="reflection">
          <div class="jar-body" style="opacity:.6">
            <div class="jar-label"><b>PEAK</b><span>Performance</span></div>
          </div>
        </div>
      </div>
      <div class="contact-shadow"></div>
    </div>
  </section>

  <script>
    // Hover-tilt: tracks pointer over the stage and re-aims the product toward it.
    // See references/css-3d-product-shots.md step 6 — swap for Atropos.js if the
    // page already has 3+ independently-moving layers (label/cap/body parallax).
    const stage = document.getElementById('stage');
    const product = document.getElementById('product');
    const base = { x: 8, y: -18 };

    stage.addEventListener('pointermove', (e) => {
      const r = stage.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      product.style.transform = `rotateX(${base.x - py * 16}deg) rotateY(${base.y + px * 24}deg)`;
    });
    stage.addEventListener('pointerleave', () => {
      product.style.transform = `rotateX(${base.x}deg) rotateY(${base.y}deg)`;
    });
  </script>
</body>
</html>
